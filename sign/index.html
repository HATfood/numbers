<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#1e3f28">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="HAT Signs">

    <title>امضای ایمیل همکاران - شرکت هستی آرین تامین</title>

    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius-lg: 16px;
            --radius-md: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1),
                      0 2px 4px -2px rgba(0, 0, 0, 0.1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-body: #0f172a;
                --bg-card: #1e293b;
                --text-main: #f1f5f9;
                --text-muted: #94a3b8;
                --border-color: #334155;
            }
        }

        * {
            box-sizing: border-box;
            transition: all 0.2s ease;
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 1.5rem 1rem;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 2rem;
            padding: 10px;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-logo {
            height: 50px;
            width: auto;
            object-fit: contain;
        }

        .header h1 {
            font-size: 1.4rem;
            margin: 0;
            background: linear-gradient(90deg, #575756, #1e3f28);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 0.5rem 1.2rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: var(--shadow);
        }

        .back-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .font-download-btn {
            background: #1e3f28;
            border-color: #1e3f28;
            color: #ffffff;
        }

        .font-download-btn:hover {
            background: #2c5a3a;
            border-color: #2c5a3a;
            color: #ffffff;
        }

        .sticky-controls {
            position: sticky;
            top: 1rem;
            z-index: 100;
            background: rgba(var(--bg-card), 0.9);
            backdrop-filter: blur(12px);
            padding: 1.2rem;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            margin-bottom: 2rem;
        }

        .search-wrapper {
            position: relative;
        }

        #search-input {
            width: 100%;
            padding: 0.8rem 3rem 0.8rem 1rem;
            border-radius: var(--radius-md);
            border: 2px solid var(--border-color);
            background: var(--bg-body);
            color: var(--text-main);
            font-size: 0.95rem;
        }

        #search-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .search-icon {
            position: absolute;
            right: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 1rem;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
            border-color: var(--primary);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.6rem;
        }

        .card-header h3 {
            margin: 0;
            font-size: 1rem;
            color: var(--text-main);
            font-weight: 700;
        }

        .sign-badge {
            background: rgba(37, 99, 235, 0.1);
            color: var(--primary);
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 50px;
            font-weight: bold;
        }

        .img-container {
            width: 100%;
            background: #ffffff;
            border: 1px dashed var(--border-color);
            border-radius: 8px;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 140px;
        }

        .img-container img {
            max-width: 100%;
            max-height: 180px;
            object-fit: contain;
            border-radius: 4px;
        }

        .card-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn {
            flex: 1;
            padding: 0.6rem;
            border-radius: var(--radius-md);
            border: none;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-decoration: none;
            text-align: center;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-secondary {
            background: var(--bg-body);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--border-color);
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            grid-column: 1 / -1;
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            padding: 2rem;
            color: var(--text-muted);
            font-size: 0.8rem;
            border-top: 1px solid var(--border-color);
        }

        @media (max-width: 600px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .header-actions {
                width: 100%;
                flex-direction: column;
            }

            .header-actions .back-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header class="header">

        <div class="header-brand">
            <img
                src="../logo.png"
                alt="لوگو شرکت"
                class="header-logo"
                onerror="this.src='https://via.placeholder.com/50x50?text=LOGO'"
            >

            <h1>امضای ایمیل همکاران</h1>
        </div>

        <div class="header-actions">

            <a
                href="../Vazirmatn-VariableFont_wght.ttf"
                download="Vazirmatn-VariableFont_wght.ttf"
                class="back-btn font-download-btn"
            >
                <i class="fas fa-font"></i>
                <span>دانلود فونت ایمیل</span>
            </a>

            <a href="../" class="back-btn">
                <i class="fas fa-arrow-right"></i>
                <span>بازگشت به دفترچه تلفن</span>
            </a>

        </div>

    </header>

    <div class="sticky-controls">
        <div class="search-wrapper">
            <i class="fas fa-search search-icon"></i>

            <input
                type="text"
                id="search-input"
                placeholder="جستجوی نام همکار یا شماره امضا..."
            >
        </div>
    </div>

    <main id="signs-grid" class="grid"></main>

    <footer>
        تهیه شده توسط واحد مارکتینگ | ۱۴۰۴

        <br>

        <a
            href="../"
            style="
                color: var(--primary);
                text-decoration: none;
                font-weight: bold;
                margin-top: 8px;
                display: inline-block;
            "
        >
            بازگشت به دفترچه تلفن شرکت
        </a>
    </footer>

</div>

<script>
    // لیست اسامی به ترتیب شماره فایل عکس
    const SIGNATURES = [
        { id: 1, name: "مجید سعادت" },
        { id: 2, name: "مهدی رنجبر" },
        { id: 3, name: "سپیده دماوندی" },
        { id: 4, name: "سید رضا نژادصالحی" },
        { id: 5, name: "سید رضا ظریفی" },
        { id: 6, name: "شهناز رحیمی" },
        { id: 7, name: "محمد کیامرزی" },
        { id: 8, name: "افسانه حقی" },
        { id: 9, name: "زهرا کنشلو" },
        { id: 10, name: "سمانه اکبری" },
        { id: 11, name: "فاطمه محمدبیگی" },
        { id: 12, name: "سید حنیف حسینی" },
        { id: 13, name: "وحید رحمانی" },
        { id: 14, name: "مریم دهقان" },
        { id: 15, name: "فروغ مهدیان" },
        { id: 16, name: "میثم گرایلی" },
        { id: 17, name: "فرشته عالی‌خانی" },
        { id: 18, name: "عادل غلام‌نژاد" },
        { id: 19, name: "شیرین فیروزبخت" },
        { id: 20, name: "مرتضی روح زنده" },
        { id: 21, name: "امید حیدری" },
        { id: 22, name: "مهتاب بیات" },
        { id: 23, name: "یزدان صادقی" },
        { id: 24, name: "علیرضا تاد" },
        { id: 25, name: "شیما سهامی" },
        { id: 26, name: "علیرضا رضایی" },
        { id: 27, name: "پرستو سیفی‌نژاد" },
        { id: 28, name: "نیما قاسمی" },
        { id: 29, name: "سید محمد مسن‌آبادی" },
        { id: 30, name: "بهاره عزیزی" },
        { id: 31, name: "سعید خانی محمودی" },
        { id: 32, name: "ملیکا اسدی" },
        { id: 33, name: "فرانک شجاعی" },
        { id: 34, name: "میثم میررضی" }
    ];

    // تبدیل اعداد انگلیسی به فارسی
    const toPersian = (num) => {
        return String(num).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
    };

    // تبدیل اعداد فارسی به انگلیسی
    const toEnglish = (str) => {
        const p2e = {
            '۰': '0',
            '۱': '1',
            '۲': '2',
            '۳': '3',
            '۴': '4',
            '۵': '5',
            '۶': '6',
            '۷': '7',
            '۸': '8',
            '۹': '9'
        };

        return String(str).replace(/[۰-۹]/g, c => p2e[c] || c);
    };

    // محاسبه آدرس کامل تصاویر
    function getImgUrl(filename) {
        let base = window.location.pathname;

        if (!base.endsWith('/')) {
            if (base.endsWith('.html')) {
                base = base.substring(0, base.lastIndexOf('/') + 1);
            } else {
                base = base + '/';
            }
        }

        return window.location.origin + base + filename;
    }

    function renderGallery(filter = '') {
        const container = document.getElementById('signs-grid');

        container.innerHTML = '';

        const rawFilter = filter.trim().toLowerCase();
        const numFilter = toEnglish(rawFilter);

        let count = 0;

        SIGNATURES.forEach(item => {
            const fileName = `${item.id}.png`;
            const fullImgPath = getImgUrl(fileName);
            const faNumber = toPersian(item.id);

            const matchName = item.name
                .toLowerCase()
                .includes(rawFilter);

            const matchNumber =
                String(item.id).includes(numFilter) ||
                faNumber.includes(rawFilter);

            if (rawFilter && !matchName && !matchNumber) {
                return;
            }

            count++;

            const card = document.createElement('div');

            card.className = 'card';

            card.innerHTML = `
                <div class="card-header">
                    <h3>${item.name}</h3>
                    <span class="sign-badge">#${faNumber}</span>
                </div>

                <div class="img-container">
                    <img
                        src="${fullImgPath}"
                        alt="امضای ${item.name}"
                        loading="lazy"
                        onerror="this.src='https://via.placeholder.com/300x120?text=تصویر+یافت+نشد'"
                    >
                </div>

                <div class="card-actions">

                    <a
                        href="${fullImgPath}"
                        download="Signature-${item.name.replace(/\s+/g, '-')}.png"
                        class="btn btn-primary"
                    >
                        <i class="fas fa-download"></i>
                        <span>دانلود PNG</span>
                    </a>

                    <button
                        class="btn btn-secondary"
                        onclick="copyImageLink('${fullImgPath}')"
                    >
                        <i class="fas fa-link"></i>
                        <span>کپی لینک</span>
                    </button>

                </div>
            `;

            container.appendChild(card);
        });

        if (count === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <i
                        class="fas fa-search fa-2x"
                        style="margin-bottom: 10px;"
                    ></i>

                    <p>امضایی با این مشخصات یافت نشد.</p>
                </div>
            `;
        }
    }

    function copyImageLink(fullUrl) {
        navigator.clipboard
            .writeText(fullUrl)
            .then(() => {
                alert('لینک تصویر کپی شد:\n' + fullUrl);
            })
            .catch(() => {
                alert('خطا در کپی لینک');
            });
    }

    document
        .getElementById('search-input')
        .addEventListener('input', (event) => {
            renderGallery(event.target.value);
        });

    renderGallery();
</script>

</body>
</html>
